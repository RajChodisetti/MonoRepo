# Standalone local stack (agent + Redis).
# Preferred entrypoint from MonoRepo root:
#   make voice-up
#   make voice-logs
#   make voice-down
#
# Definition also lives in ../infra/docker/docker-compose.yml (profile "voice").

services:
  agent:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379
      - CALL_LOG_DB=/app/data/calls.db
      # Reach MonoRepo API on the host (localhost inside the container is not the Mac)
      - MONOREPO_API_URL=http://host.docker.internal:8080
      - TUVI_WEBSITE_API_URL=http://host.docker.internal:8090
      - API_TIMEOUT_MS=20000
      - TUVI_API_TIMEOUT_MS=20000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./bot.py:/app/bot.py
      - ./api_client.py:/app/api_client.py
      - ./tuvi_api_client.py:/app/tuvi_api_client.py
      - ./prompts:/app/prompts
      - ./static:/app/static
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
