# Postgres only:  docker compose up -d postgres --wait
# Full VM stack: make up  (uses profile "stack")

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant_platform_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    profiles: [stack]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: restaurant_platform_migrate
    command: ["/app/migrate", "up"]
    env_file:
      - stack.env.example
      - path: stack.env
        required: false
      - path: ../../backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/restaurant_platform?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [stack]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: restaurant_platform_api
    command: ["/app/api"]
    ports:
      - "8080:8080"
    env_file:
      - stack.env.example
      - path: stack.env
        required: false
      - path: ../../backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/restaurant_platform?sslmode=disable
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: [stack]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: restaurant_platform_worker
    command: ["/app/worker"]
    env_file:
      - stack.env.example
      - path: stack.env
        required: false
      - path: ../../backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/restaurant_platform?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
