              schema:
                $ref: '#/components/schemas/OutreachRecipientList'

  /api/v1/outreach/bulk-send:
    post:
      tags: [Email Campaigns]
      summary: Enable and trigger the Gmail outreach job (compatibility route)
      operationId: triggerBulkOutreachSend
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Enables the persisted email-job control and enqueues
        an `outreach.bulk_send` job. The admin UI uses `PATCH /api/v1/outreach/email-job`.

        Eligible recipients have a name, valid business email, inferred-business consent
        evidence, lifecycle `lead` or `emailed`, no expressed interest, and no suppression.
        Profile, demo, image-analysis, and legacy campaign readiness are not prerequisites.

        Every current message is `text/plain` with no HTML body or open pixel. Rendering
        permits exactly `https://tuvisolutions.com` and the personalized unsubscribe URL.
        The first enabled step is immediate; each later enabled step uses its configured
        delay (the approved default sequence uses 72 hours). All unfinished follow-ups,
        including future-due follow-ups, are completed before any new recipient begins.

        Confirmed provider acceptance alone advances `current_step`, records the send time,
        and schedules the next enabled step. Skipped or failed/ambiguous outcomes never
        advance. Provider quotas and pacing remain PostgreSQL-backed and restart-safe.
      responses:
        '202':
          description: Bulk job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOutreachTriggerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Bulk job already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Gmail OAuth outreach accounts not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/outreach/email-job:
    patch:
      tags: [Email Campaigns]
      summary: Enable or disable the Gmail outreach job from the admin UI
      operationId: setOutreachEmailJob
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. `enabled=true` persists the operational control and
        immediately queues one durable run over eligible inferred-business recipients.
        `enabled=false` cancels any safely deferred queued job and prevents another provider
        attempt; an in-flight request keeps its fenced lease long enough to record the exact
        outcome. Re-enabling can resume that one lease without creating a competing job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Persisted email-job state and queued job metadata when enabling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailJobActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another outreach job is already queued or running
        '503':
          description: Gmail OAuth outreach accounts are not configured

  /api/v1/outreach/bulk-send/status:
    get:
      tags: [Email Campaigns]
      summary: Bulk outreach status
      operationId: getBulkOutreachStatus
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`.
        Returns pending eligible lead count, the next durable account availability time,
        the persisted UI email-job state, and active/last bulk job summary.
      responses:
        '200':
          description: Bulk outreach status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOutreachStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/outreach/email-accounts/health:
    get:
      tags: [Email Campaigns]
      summary: List configured Gmail outreach sender health
      operationId: listGmailOutreachHealth
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Each configured Gmail mailbox sends a real message
        to `OUTREACH_EMAIL_HEALTH_RECIPIENT` when first registered and at the configured
        interval (minimum 24 hours). Health checks are independent of the outreach-job toggle.
        The response exposes status metadata, never OAuth secrets.
      responses:
        '200':
          description: Gmail sender health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAccountHealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Gmail health service is not configured

  /api/v1/developer/schema:
    get:
      tags: [Developer]
      summary: List public PostgreSQL tables and columns
      operationId: developerSchema
      security:
        - bearerAuth: []
      description: Requires role `internal_admin`. Returns table and column metadata from `information_schema`.
      responses:
        '200':
          description: Public schema tables and columns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperSchemaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Database not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/developer/sql:
    post:
      tags: [Developer]
      summary: Execute a read-only SQL query
      operationId: developerExecuteSQL
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Executes one read-only `SELECT`, `WITH`, `SHOW`,
        or `EXPLAIN` statement inside a PostgreSQL read-only transaction with a short
        statement timeout and a 200-row response cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeveloperSQLRequest'
            example:
              query: |
                SELECT
                  lower(trim(mi.name)) AS item_name,
                  count(DISTINCT m.restaurant_id) AS restaurant_count
                FROM menu_items mi
                JOIN menus m ON m.id = mi.menu_id
                GROUP BY lower(trim(mi.name))
                ORDER BY restaurant_count DESC
                LIMIT 100
      responses:
        '200':
          description: Query result rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperQueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Database not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /t/click/{token}:
    parameters:
      - $ref: '#/components/parameters/trackingToken'
    get:
      tags: [Email Tracking]
      summary: Track demo link click
      operationId: trackEmailClick
      security: []
      description: |
        Public endpoint (no auth). Records `clicked` in `email_events`, then **302 redirects**
        to the demo URL stored on the tracking token. A successfully recorded click also
        sets the restaurant's `shown_interest=true` and advances eligible lifecycle states
        to `interested`.
      responses:
        '302':
          description: Redirect to demo site
          headers:
            Location:
              schema:
                type: string
                example: https://demo.tuvisolutions.com/?slug=test-cafe-demo&token=...&template=1
        '404':
          $ref: '#/components/responses/NotFound'

  /t/open/{token}:
    parameters:
      - $ref: '#/components/parameters/trackingToken'
    get:
      tags: [Email Tracking]
      summary: Track email open (tracking pixel)
      operationId: trackEmailOpen
      security: []
      description: |
        Historical compatibility endpoint (no auth). Current plain-text outreach sequences
        never create or embed open-tracking tokens.
      responses:
        '200':
          description: Transparent GIF pixel
          content:
            image/gif:
              schema:
                type: string
                format: binary

  /t/unsubscribe/{token}:
    parameters:
      - $ref: '#/components/parameters/trackingToken'
    get:
      tags: [Email Tracking]
      summary: Show opt-out confirmation
      operationId: confirmEmailUnsubscribe
      security: []
      description: |
        Public endpoint (no auth). Validates the token and returns a no-store HTML page
        with an explicit opt-out button and one link to `https://tuvisolutions.com`.
        GET does not mutate suppression or campaign state.
      responses:
        '200':
          description: HTML confirmation form
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Email Tracking]
      summary: Confirm opt-out
      operationId: submitEmailUnsubscribe
      security: []
      description: |
        Adds the immutable normalized recipient snapshot to `email_suppressions`, records
        an `unsubscribed` event, stops remaining steps, and returns a no-store confirmation
        page with a Tuvi Solutions link. Repeated submissions are idempotent.
      responses:
        '200':
          description: HTML opt-out confirmation
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Suppression persistence failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/v1/seo/search:
    get:
      tags: [Public SEO Review]
      summary: Search for a restaurant to review
      operationId: searchPublicSEOReviewRestaurants
      security: []
      description: |
        Searches live Google Places and returns at most eight public results. A query
        shorter than two characters returns an empty result list rather than an error.
        Internal reviewed-profile inventory is deliberately not queried by this public
        surface.
      parameters:
        - name: q
          in: query
          required: false
          description: Restaurant name or search phrase. Fewer than two trimmed characters returns no results.
          schema:
            type: string
        - name: location
          in: query
          required: false
          description: City, suburb, or postcode used to scope Google Places; defaults to Australia.
          schema:
            type: string
      responses:
        '200':
          description: Restaurant matches and enabled-source metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEOReviewSearchResponse'
        '429':
          description: Per-client or global public SEO request limit was reached
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Restaurant search failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/v1/seo/report/{place_id}:
    parameters:
      - name: place_id
        in: path
        required: true
        description: Google Place ID or reviewed-profile place identifier returned by the search endpoint.
        schema:
          type: string
          minLength: 1
    get:
      tags: [Public SEO Review]
      summary: Generate a live Venue Pulse report
      operationId: getPublicSEOReviewReport
      security: []
      description: |
        Generates a fresh, 100-point digital-footprint review. Concurrent requests for the
        same place can share one in-flight generation, but completed Google Places content
        is not retained for later requests.

        `report.fullReportLocked` is the authoritative access flag. Without a valid,
        verified, unexpired unlock token, the server removes competitor names/rows,
        issue details, the AI summary, website review, menu URL/rationale, social profile
        URLs/rationale, and per-metric rationale/evidence/recommendations before JSON is
        serialized. Listing photos, recent reviews, and desktop/mobile website screenshots
        remain available so the requester can see the evidence being scanned. An invalid,
        expired, or different-place token returns the normal locked `200` response rather
        than disclosing token validity.

        All responses are marked `Cache-Control: no-store`. The Tuvi web BFF stores the
        seven-day token in an HttpOnly cookie and sends it only in the server-to-server
        `Authorization` header. Unlock bearer secrets must never appear in URLs.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: Optional `Bearer <unlock_token>` issued after OTP verification. This is distinct from an API user JWT and must never be placed in a URL.
          schema:
            type: string
            pattern: '^Bearer [0-9a-f]{48}$'
      responses:
        '200':
          description: Locked or verified full report, as indicated by `report.fullReportLocked`
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEOReviewReportResponse'
        '400':
          description: Missing or invalid place ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Per-client or global public SEO request limit was reached
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Live report generation is at capacity; retry after the response delay
          headers:
            Retry-After:
              schema:
                type: integer
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Report generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/v1/seo/unlock/request:
    post:
      tags: [Public SEO Review]
      summary: Email a Venue Pulse verification code
      operationId: requestPublicSEOReviewUnlock
      security: []
      description: |
        Requires and persists the requester's name, normalized email, phone number, and
        selected restaurant before sending a six-digit OTP. The email contains no bearer
        link. The OTP expires after 15 minutes. Repeated requests for the same email/place are limited to one per
        60 seconds. Bounded email/place, email, client-IP, and global guards run before the
        lightweight Places identity lookup; this endpoint does not regenerate the full
        website/competitor report. Requesting a code does not opt the requester into marketing and does not
        mark the restaurant as interested. The JSON decoder rejects unknown fields,
        trailing JSON values, and bodies larger than 8 KiB. Responses are `no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SEOReviewUnlockRequest'
      responses:
        '200':
          description: Verification email accepted or local-only code issued
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEOReviewUnlockRequestResult'
        '400':
          description: Invalid JSON, name, email, or phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: The email/place cooldown, broader email spray guard, or per-client/global public SEO limit was reached
          headers:
            Retry-After:
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Verification email could not be sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unlock request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/v1/seo/unlock/verify:
    post:
      tags: [Public SEO Review]
      summary: Verify the emailed code and return the full report
      operationId: verifyPublicSEOReviewUnlock
      security: []
      description: |
        Verifies the exact six-digit OTP for the normalized email and selected place. Five
        failed attempts exhaust the pending code. A successful verification updates only
        the requester row in `seo_interested`, activates the opaque unlock token for seven
        days, and returns the unredacted report. It never creates or updates a canonical
        restaurant/profile, infers ownership, changes scrape status, or records marketing
        consent; the `interested` field reports separately recorded intent. Unknown JSON fields,
        trailing JSON values, and bodies larger than 8 KiB are rejected. Responses are
        `no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SEOReviewUnlockVerifyRequest'
      responses:
        '200':
          description: Email verified and full report unlocked
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEOReviewUnlockVerifyResult'
        '400':
          description: Invalid JSON or email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Code is malformed, incorrect, expired, or exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Per-client or global public SEO request limit was reached
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Live report generation is at capacity
          headers:
            Retry-After:
              schema:
                type: integer
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unlock verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/v1/seo/photo:
    get:
      tags: [Public SEO Review]
      summary: Resolve a live Google Places photo
      operationId: getPublicSEOReviewPhoto
      security: []
      description: |
        Proxies a Google Places photo resource while keeping the provider key server-side.
        The effective square size is clamped to 64–1600 pixels. Photo bytes are fetched
        live and returned with `private, no-store, max-age=0`; clients must not persist or
        cache them. Attribution text and source links are supplied on the corresponding
        report media card and must be rendered with the image.
      parameters:
        - name: name
          in: query
          required: true
          description: Google photo resource name from `place.media`, for example `places/{placeId}/photos/{photoId}`.
          schema:
            type: string
            minLength: 1
        - name: max
          in: query
          required: false
          description: Requested maximum height and width; positive values are clamped to 64–1600.
          schema:
            type: integer
            minimum: 1
            default: 720
      responses:
        '200':
          description: Live image bytes
          headers:
            Cache-Control:
              description: Always `private, no-store, max-age=0`.
              schema:
                type: string
                example: private, no-store, max-age=0
            Pragma:
              schema:
                type: string
                enum: [no-cache]
          content:
            image/*:
              schema:
                type: string
                format: binary
        '400':
          description: Photo resource name is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Photo resource was not found or Google Places photo access is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Per-client or global public SEO request limit was reached
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Google Places photo fetch failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/v1/site/restaurants/by-id/{id}:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
    get:
      tags: [Public Demo]
      summary: Load restaurant-specific website content by immutable restaurant ID
      operationId: getPublicRestaurantSiteById
      security: []
      responses:
        '200':
          description: Public restaurant profile, menu, gallery, and review content
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/public/v1/restaurants/{id}/table-availability:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
    get:
      tags: [Reservations]
      summary: Get available reservation-request slots
      operationId: getPublicTableAvailability
      security: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: party_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 2
      responses:
        '200':
          description: Available RFC3339 slots for the requested date and party size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationAvailability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/public/v1/restaurants/{id}/reservations:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
    put:
      tags: [Reservations]
      summary: Submit a pending reservation request
      operationId: putPublicReservationRequest
      security: []
      description: |
        Creates a reservation request in `pending` status; it does not confirm a table.
        `client_request_id` makes an identical retried browser submission idempotent for
        the same restaurant. Reusing it with different guest, party, slot, source, or notes
        returns `409 client_request_conflict` rather than returning another request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutReservationRequest'
      responses:
        '200':
          description: Reservation request recorded (normally pending confirmation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Selected slot is unavailable, or the idempotency key was reused for a different request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/v1/demo/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: pm-demo-thai-kitchen
      - name: token
        in: query
        required: true
        schema:
          type: string
        description: Opaque demo bearer token from the create-demo response
    get:
      tags: [Public Demo]
      summary: Resolve public demo payload
      operationId: getPublicDemo
      security: []
      description: |
        No authentication. Validates slug + token and requires the demo to remain published
        and unexpired. Returns allowlisted public fields only (internal fields like
        `lead_notes` are stripped). Token-gated preview clients use `cache: no-store` so an
        unpublish or expiry revokes subsequent loads.
      responses:
        '200':
          description: Public-safe demo payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDemoPayload'
        '404':
          description: Demo not found or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: demo_not_found
                  message: Demo site was not found.

  /api/public/v1/demo/{slug}/sessions:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Public Demo]
      summary: Start engagement tracking for a signed demo
      operationId: startPublicDemoSession
      security: []
      description: Validates the same published, unexpired slug and opaque demo token as the demo payload endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [demo_token, template_id]
              properties:
                demo_token:
                  type: string
                template_id:
                  type: string
                  enum: ['1', '2', '3']
      responses:
        '201':
          description: Short-lived browser session capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSessionCapability'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/public/v1/demo-sessions/{session_id}/events:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Public Demo]
      summary: Record signed-demo heartbeat or end
      operationId: touchPublicDemoSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token, event, active_seconds]
              properties:
                session_token:
                  type: string
                event:
                  type: string
                  enum: [heartbeat, end]
                active_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  description: Browser-measured foreground time; hidden-tab time is excluded.
      responses:
        '204':
          description: Session duration updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/public/v1/demo-sessions/{session_id}/transcript:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Public Demo]
      summary: Store an AI receptionist transcript turn for a signed-demo session
      operationId: addPublicDemoTranscript
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token, role, content]
              properties:
                session_token:
                  type: string
                role:
                  type: string
                  enum: [user, assistant, system]
                content:
                  type: string
                  maxLength: 4000
      responses:
        '204':
          description: Transcript turn recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /healthz:
    get:
      tags: [Health]
      summary: Service health
      operationId: healthz
      security:
        - bearerAuth: []
      description: Requires role `developer`.
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /readyz:
    get:
      tags: [Health]
      summary: Database readiness
      operationId: readyz
      security:
        - bearerAuth: []
      description: Requires role `developer`. Pings PostgreSQL.
      responses:
        '200':
          description: Database is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Database not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from signup or login
    consultationStaticBearer:
      type: http
      scheme: bearer
      description: Static token configured as `TUVI_API_TOKEN`; used by approved company consultation clients such as the corporate voice agent.

  parameters:
    restaurantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    restaurantNameFilter:
      name: restaurant
      in: query
      schema:
        type: string
      description: Case-insensitive substring match on restaurant name
    statusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/RestaurantStatus'
    isContactedFilter:
      name: is_contacted
      in: query
      schema:
        type: boolean
    shownInterestFilter:
      name: shown_interest
      in: query
      schema:
        type: boolean
    includeArchivedFilter:
      name: include_archived
      in: query
      schema:
        type: boolean
        default: false
    campaignId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Email campaign UUID
    demoSiteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Demo site UUID
    scrapeJobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Durable city scrape job UUID
    trackingToken:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: Opaque tracking token from `email_tracking_tokens`

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Authentication required.
    Forbidden:
      description: Insufficient role or restaurant access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: You do not have access to this restaurant.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: Restaurant was not found.
    Conflict:
      description: Resource conflict (e.g. duplicate email)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict
              message: Email is already registered.
    ConsultationCalendarConflict:
      description: The month changed after the client loaded it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: consultation_calendar_conflict
              message: The consultation calendar changed after it was loaded. Refresh the month and reapply your changes.
    CampaignConflict:
      description: Campaign state conflict (e.g. already stopped)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: campaign_stopped
              message: campaign is stopped
    CampaignNotEligible:
      description: Campaign or restaurant not eligible to send
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_eligible
              message: 'campaign is not eligible to send: restaurant profile is not approved for outreach'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: Request body must be valid JSON.

    SEOReviewSearchResponse:
      type: object
      required: [results, meta]
      properties:
        results:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SEOReviewPlaceSummary'
        meta:
          $ref: '#/components/schemas/SEOReviewSearchMeta'

    SEOReviewSearchMeta:
      type: object
      required: [placesEnabled, inventoryEnabled]
      properties:
        placesEnabled:
          type: boolean
          description: Whether Google Places was configured; this does not guarantee that it returned a match.
        inventoryEnabled:
          type: boolean
          description: Whether the reviewed-profile inventory was available.

    SEOReviewPlaceSummary:
      type: object
      required: [placeId, name, address, source]
      properties:
        placeId:
          type: string
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        userRatingCount:
          type: integer
          minimum: 0
        attributions:
          type: array
          description: Third-party data providers Google requires to be displayed with this search result.
          items:
            $ref: '#/components/schemas/SEOReviewPlaceAttribution'
        source:
          type: string
          enum: [places, monorepo]

    SEOReviewReportResponse:
      type: object
      required: [place, report]
      properties:
        place:
          $ref: '#/components/schemas/SEOReviewPlaceDetails'
        report:
          $ref: '#/components/schemas/SEOReviewReport'

    SEOReviewPlaceDetails:
      type: object
      required: [placeId, name, address, source]
      properties:
        placeId:
          type: string
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        mapsUri:
          type: string
          format: uri
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        userRatingCount:
          type: integer
          minimum: 0
        priceLevel:
          type: string
        businessStatus:
          type: string
        types:
          type: array
          items:
            type: string
        primaryType:
          type: string
          description: Google Places primary type, used to select the same-cuisine competitor cohort when it is a specific `*_restaurant` type.
          example: thai_restaurant
        editorialSummary:
          type: string
        attributions:
          type: array
          description: Third-party data providers Google requires to be displayed with this Place content.
          items:
            $ref: '#/components/schemas/SEOReviewPlaceAttribution'
        source:
          type: string
          enum: [places, monorepo]
        media:
          $ref: '#/components/schemas/SEOReviewPlaceMedia'

    SEOReviewPlaceMedia:
      type: object
      description: Live, attributed Google Places photo references; the API does not classify generic Places photos as Menu-tab evidence.
      properties:
        menuAndHighlights:
          type: array
          items:
            $ref: '#/components/schemas/SEOReviewMediaCard'
        photosAndVideos:
          type: array
          items:
            $ref: '#/components/schemas/SEOReviewMediaCard'
        mapsUri:
          type: string
          format: uri

    SEOReviewMediaCard:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [menu, highlight, photo, latest, video]
        label:
          type: string
        subtitle:
          type: string
          description: Google photo author attribution when supplied.
        imageUrl:
          type: string
          format: uri
        photoName:
          type: string
          description: Live Google Places photo resource name to resolve through `/api/public/v1/seo/photo`.
        href:
          type: string
          format: uri
          description: Google Maps/photo source link, or a fallback official website link, to render with the media.
        authorAttributions:
          type: array
          description: Google-provided contributor identities that must be rendered with the photo when supplied.
          items:
            $ref: '#/components/schemas/SEOReviewAuthorAttribution'
        googleMapsUri:
          type: string
          format: uri
          description: Google Maps URI for the exact photo resource when supplied.
        flagContentUri:
          type: string
          format: uri
          description: Google-provided URI for reporting inappropriate photo content.

    SEOReviewAuthorAttribution:
      type: object
      description: Google-provided photo contributor identity; fields are omitted when Google does not supply them.
      properties:
        displayName:
          type: string
        uri:
          type: string
          format: uri
          description: Contributor profile URI.
        photoUri:
          type: string
          format: uri
          description: Contributor avatar URI.

    SEOReviewPlaceAttribution:
      type: object
      description: Third-party Place data attribution returned by Google; all supplied providers must remain visible with the associated Place content.
      properties:
        provider:
          type: string
        providerUri:
          type: string
          format: uri
          description: Provider source URI when Google supplies one.

    SEOReviewReport:
      type: object
      required:
        - restaurantName
        - address
        - overallScore
        - overallLabel
        - overallColor
        - metrics
        - competitors
        - competitorScan
        - menuEvidence
        - socialPresence
        - issues
        - aiSummary
        - estimatedMonthlyLoss
        - fullReportLocked
        - unlockCta
        - analysisSource
        - analysisStatus
        - generatedInMs
      description: |
        A declared 100-point score: SEO keywords 20, recent reviews 25, website
        design/readability/mobile-friendliness 20, order online 5, verified menu data 10,
        phone and email 10, and listing completeness 10. Verified social presence contributes
        up to three points inside listing completeness rather than increasing the total.

        When `fullReportLocked` is true, server-side serialization redacts the sensitive
        fields documented on their schemas. CSS blur is presentational only and is not the
        access-control boundary.
      properties:
        restaurantName:
          type: string
        address:
          type: string
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
        overallLabel:
          type: string
          enum: [Good, Fair, Poor]
        overallColor:
          type: string
          description: Hex color associated with the overall label.
          pattern: '^#[0-9a-fA-F]{6}$'
        metrics:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/SEOReviewMetric'
        competitors:
          type: array
          nullable: true
          description: Legacy projection of `competitorScan.rows`; `null` while locked.
          items:
            $ref: '#/components/schemas/SEOReviewCompetitorRow'
        competitorScan:
          $ref: '#/components/schemas/SEOReviewCompetitorScan'
        menuEvidence:
          $ref: '#/components/schemas/SEOReviewMenuEvidence'
        socialPresence:
          $ref: '#/components/schemas/SEOReviewSocialPresence'
        issues:
          type: array
          nullable: true
          description: Prioritized improvements; `null` while locked.
          items:
            $ref: '#/components/schemas/SEOReviewIssue'
        aiSummary:
          type: string
          description: Deterministic findings summary; an empty string while locked. Google listing and review content is not sent to a third-party LLM.
        estimatedMonthlyLoss:
          type: integer
          minimum: 0
          maximum: 0
          deprecated: true
          description: Legacy compatibility field that is always zero because venue sales and conversion inputs are unavailable.
        fullReportLocked:
          type: boolean
          description: Authoritative server-side lock state. Only `false` permits display or PDF export of gated findings.
        unlockCta:
          type: string
          description: Verification prompt while locked; empty after successful unlock.
        websiteScreenshot:
          type: string
          description: Desktop homepage capture as a `data:image/jpeg;base64,...` URL; intentionally visible during the locked scan.
        websiteMobileScreenshot:
          type: string
          description: Independent mobile viewport capture as a `data:image/jpeg;base64,...` URL; intentionally visible during the locked scan.
        websiteQualityScore:
          type: integer
          minimum: 0
          maximum: 100
        websiteReview:
          type: string
          description: Detailed website observations and suggestions; omitted while locked.
        analysisSource:
          type: string
          enum: [automated, ai-assisted]
          description: "`ai-assisted` only when an LLM analyzed the restaurant's own website screenshot; Places listing and review content remains deterministic."
        analysisStatus:
          type: string
          enum: [complete, partial]
        analysisNotice:
          type: string
          description: Truthful explanation of AI use, conservative fallback scoring, or incomplete live signals.
        generatedInMs:
          type: integer
          format: int64
          minimum: 0
        recentReviews:
          type: array
          description: Up to five live Google reviews used and shown during the scan; intentionally visible before verification.
          maxItems: 5
          items:
            $ref: '#/components/schemas/SEOReviewRecentReview'

    SEOReviewMetric:
      type: object
      required: [key, label, score, max, status, statusColor, value]
      properties:
        key:
          type: string
          enum: [seo, reviews, website, order_online, menu, contact, listing]
        label:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 25
        max:
          type: integer
          enum: [5, 10, 20, 25]
          description: Weight assigned to this scoring bucket; all seven maxima sum to 100.
        status:
          type: string
          enum: [Good, Fair, Poor]
        statusColor:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        value:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: "`score / max` ratio."
        rationale:
          type: string
          description: Why this bucket received its score; omitted while locked.
        evidence:
          type: array
          description: Specific listing or website observations supporting the score; omitted while locked.
          items:
            type: string
        recommendation:
          type: string
          description: Concrete action to improve this bucket; omitted while locked.

    SEOReviewIssue:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
        description:
          type: string

    SEOReviewRecentReview:
      type: object
      properties:
        author:
          type: string
        authorUri:
          type: string
          format: uri
          description: Google-provided reviewer profile URI.
        authorPhotoUri:
          type: string
          format: uri
          description: Google-provided reviewer avatar URI.
        googleMapsUri:
          type: string
          format: uri
          description: Google Maps URI for the exact review when supplied.
        flagContentUri:
          type: string
          format: uri
          description: Google-provided URI for reporting inappropriate review content.
        text:
          type: string
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        relativeTime:
          type: string
        publishTime:
          type: string
          format: date-time
        visitDate:
          $ref: '#/components/schemas/SEOReviewVisitDate'
        sentiment:
          type: string
          enum: [positive, mixed, negative]

    SEOReviewVisitDate:
      type: object
      description: Visit date supplied with a Google review. Google can return only year and month.
      properties:
        year:
          type: integer
          minimum: 1
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31

    SEOReviewMenuEvidence:
      type: object
      required: [status, hasWebsiteLink, hasStructuredData, rationale]
      description: |
        Fail-closed menu assessment from the official website. Google Places photo
        resources do not expose the Google Maps Menu-tab category, so generic listing
        photos never earn menu points. Only a verified menu link or Menu JSON-LD counts.
        `menuUrl` is omitted and `rationale` is an empty string while the report is locked.
      properties:
        status:
          type: string
          enum: [present, not_found, unknown]
        hasWebsiteLink:
          type: boolean
        hasStructuredData:
          type: boolean
        menuUrl:
          type: string
          format: uri
        source:
          type: string
          description: Evidence origin such as `website`, `website_link`, `website_jsonld`, or `places`.
        rationale:
          type: string

    SEOReviewSocialPresence:
      type: object
      required: [status, score, max]
      description: |
        Canonical public social handles discovered from the official website or when a
        social profile is itself the listing website. This signal contributes up to three
        points inside the 10-point listing-completeness metric. Profiles and rationale are
        omitted while locked.
      properties:
        status:
          type: string
          enum: [present, not_found, unknown]
        score:
          type: integer
          minimum: 0
          maximum: 3
        max:
          type: integer
          enum: [3]
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/SEOReviewSocialProfile'
        rationale:
          type: string

    SEOReviewSocialProfile:
      type: object
      required: [platform, url, source]
      properties:
        platform:
          type: string
          enum: [Instagram, Facebook, TikTok, X, LinkedIn, YouTube, Threads, Linktree]
        handle:
          type: string
        url:
          type: string
          format: uri
        source:
          type: string
          enum: [website_link, places_website]

    SEOReviewCompetitorScan:
      type: object
      required:
        - status
      description: |
        Honest same-cuisine comparison from Google Places Nearby Search within a circular
        10 km radius. Candidates are scored with the same deterministic 100-point Google
        visibility model. This is not a claim about a fixed Google Search or Map Pack rank.
        Only competitors with a higher visibility score are included. While locked, all
        cohort metadata, scores, positions, conclusions, notices, and rows are redacted;
        only `status: locked` remains. No competitor photos are returned.
      properties:
        status:
          type: string
          enum: [locked, complete, no_data, partial, unavailable]
        radiusKm:
          type: number
          format: double
          minimum: 0
          maximum: 10
        cuisine:
          type: string
          description: Human-readable Google primary cuisine type used for the cohort.
          example: thai restaurant
        scoreKind:
          type: string
          enum: [google_visibility]
        sampleSize:
          type: integer
          minimum: 0
          description: Eligible nearby same-cuisine listings examined, not the number that beat the current venue.
        currentScore:
          type: integer
          minimum: 0
          maximum: 100
        currentPosition:
          type: integer
          minimum: 1
          description: Position after the stronger rows in this deterministic sample; omitted when no position can be supported.
        currentRestaurantLeading:
          type: boolean
          description: True when no sampled candidate had a higher visibility score.
        notice:
          type: string
          description: Plain-language data limitation or honest leading/behind explanation.
        rows:
          type: array
          description: Genuine stronger nearby listings; omitted while locked or when no defensible comparison is available.
          items:
            $ref: '#/components/schemas/SEOReviewCompetitorRow'

    SEOReviewCompetitorRow:
      type: object
      required:
        - rank
        - name
        - rating
        - visibilityScore
        - score
        - scoreMax
        - distanceKm
        - scoreColor
        - highlight
      properties:
        rank:
          type: string
          description: Ordinal among only the stronger candidates, for example `1st`.
        placeId:
          type: string
        name:
          type: string
        rating:
          type: string
          description: Formatted Google rating label, or an em dash when unavailable.
        userRatingCount:
          type: integer
          minimum: 0
        visibilityScore:
          type: integer
          minimum: 0
          maximum: 100
        score:
          type: string
          pattern: '^\d{1,3}/100$'
        scoreMax:
          type: integer
          enum: [100]
        distanceKm:
          type: number
          format: double
          minimum: 0
          maximum: 10
        reasons:
          type: array
          maxItems: 3
          items:
            type: string
        attributions:
          type: array
          description: Third-party data providers Google requires to be displayed with this competitor Place content.
          items:
            $ref: '#/components/schemas/SEOReviewPlaceAttribution'
        scoreColor:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        highlight:
          type: boolean

    SEOReviewUnlockRequest:
      type: object
      additionalProperties: false
      required: [name, email, phone, placeId]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Requester's name after trimming and collapsing whitespace.
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 40
          pattern: '^[+0-9().\s-]+$'
          description: International-friendly phone with 7–20 digits; common spaces and punctuation are preserved.
        placeId:
          type: string
          minLength: 1

    SEOReviewUnlockRequestResult:
      type: object
      required: [status, message, email, placeId, expiresInSec]
      properties:
        status:
          type: string
          enum: [ok]
        message:
          type: string
        email:
          type: string
          format: email
          description: Normalized lowercase recipient address.
        placeId:
          type: string
        expiresInSec:
          type: integer
          enum: [900]
        devOtp:
          type: string
          pattern: '^\d{6}$'
          description: Local/test-only fallback; never populated by a normal production response.

    SEOReviewUnlockVerifyRequest:
      type: object
      additionalProperties: false
      required: [email, placeId, otp]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        placeId:
          type: string
          minLength: 1
        otp:
          type: string
          pattern: '^\d{6}$'

    SEOReviewUnlockVerifyResult:
      type: object
      required: [status, unlockToken, interested, place, report]
      properties:
        status:
          type: string
          enum: [ok]
        unlockToken:
          type: string
          description: Opaque seven-day secret. The Tuvi web BFF strips this from browser JSON and stores it in an HttpOnly cookie.
        interested:
          type: boolean
          description: Separately recorded marketing interest; OTP verification does not set it to true.
        place:
          $ref: '#/components/schemas/SEOReviewPlaceDetails'
        report:
          allOf:
            - $ref: '#/components/schemas/SEOReviewReport'
          description: Unredacted report with `fullReportLocked` equal to false.

    SignupRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/SignupRole'

    SignupRole:
      type: string
      enum: [restaurant_owner, developer]
      default: restaurant_owner

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResult:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Seconds until token expiry
        user:
          $ref: '#/components/schemas/UserView'

    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UserRole:
      type: string
      enum: [internal_admin, restaurant_owner, developer]

    AuthMe:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'

    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [internal_admin]

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        restaurants:
          type: array
          items:
            $ref: '#/components/schemas/UserRestaurantMembership'

    UserRestaurantMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/RestaurantStatus'
        member_role:
          type: string
          example: owner

    RestaurantStatus:
      type: string
      enum:
        - lead
        - demo_ready
        - emailed
        - interested
        - client_onboarding
        - active_client
        - lost
        - archived

    Restaurant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        status:
          $ref: '#/components/schemas/RestaurantStatus'
        is_contacted:
          type: boolean
        shown_interest:
          type: boolean
        email_sent:
          type: boolean
          description: True only after a confirmed provider-accepted outreach send.
        email_send_count:
          type: integer
          minimum: 0
          description: Number of confirmed sends recorded for this restaurant.
        last_email_sent_at:
          type: string
          format: date-time
          nullable: true
        last_email_send_sequence:
          type: integer
          format: int64
          nullable: true
          description: Global delivery-attempt sequence associated with the latest confirmed send.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RestaurantList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Restaurant'

    CreateRestaurantRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    UpdateRestaurantRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        is_contacted:
          type: boolean
        shown_interest:
          type: boolean

    UpdateRestaurantStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/RestaurantStatus'

    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        member_role:
          type: string
          example: owner
        created_at:
          type: string
          format: date-time

    MemberList:
      type: object
      properties:
        items:
          type: array
