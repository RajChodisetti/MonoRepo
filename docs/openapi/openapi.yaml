  /t/click/{token}:
    parameters:
      - $ref: '#/components/parameters/trackingToken'
    get:
      tags: [Email Tracking]
      summary: Track demo link click
      operationId: trackEmailClick
      security: []
      description: |
        Public endpoint (no auth). Records `clicked` in `email_events`, then **302 redirects**
        to the demo URL stored on the tracking token. A successfully recorded click also
        sets the restaurant's `shown_interest=true` and advances eligible lifecycle states
        to `interested`.
      responses:
        '302':
          description: Redirect to demo site
          headers:
            Location:
              schema:
                type: string
                example: https://demo.tuvisolutions.com/?slug=test-cafe-demo&token=...&template=1
        '404':
          $ref: '#/components/responses/NotFound'

  /t/open/{token}:
    parameters:
      - $ref: '#/components/parameters/trackingToken'
    get:
      tags: [Email Tracking]
      summary: Track email open (tracking pixel)
      operationId: trackEmailOpen
      security: []
      description: |
        Public endpoint (no auth). Returns a 1×1 GIF and records `opened` in `email_events`.
        Embedded in HTML email when `EMAIL_OPEN_TRACKING_ENABLED=true`.
        Open tracking is approximate (many clients block pixels).
      responses:
        '200':
          description: Transparent GIF pixel
          content:
            image/gif:
              schema:
                type: string
                format: binary

  /t/unsubscribe/{token}:
    parameters:
      - $ref: '#/components/parameters/trackingToken'
    get:
      tags: [Email Tracking]
      summary: Unsubscribe from outreach
      operationId: trackEmailUnsubscribe
      security: []
      description: |
        Public endpoint (no auth). Adds the normalized immutable recipient stored on
        this tracking token to `email_suppressions`, records an `unsubscribed` event,
        and returns a simple HTML confirmation page. New tokens never read the
        restaurant's mutable current email address. For legacy tokens created before
        migration `000021`, where immutable history is unavailable, it preserves the
        previously supported opt-out by suppressing the restaurant's current normalized
        address and records `recipient_snapshot=false` in the audit event.
      responses:
        '200':
          description: HTML confirmation page
          content:
            text/html:
              schema:
                type: string
                example: '<!DOCTYPE html><html><body><h1>Unsubscribed</h1>...</body></html>'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The immutable recipient could not be proven, or suppression persistence failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

