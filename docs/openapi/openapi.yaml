              properties:
                session_token:
                  type: string
                event:
                  type: string
                  enum: [heartbeat, end]
                active_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  description: Browser-measured foreground time; hidden-tab time is excluded.
      responses:
        '204':
          description: Session duration updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/public/v1/demo-sessions/{session_id}/transcript:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Public Demo]
      summary: Store an AI receptionist transcript turn for a signed-demo session
      operationId: addPublicDemoTranscript
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token, role, content]
              properties:
                session_token:
                  type: string
                role:
                  type: string
                  enum: [user, assistant, system]
                content:
                  type: string
                  maxLength: 4000
      responses:
        '204':
          description: Transcript turn recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /healthz:
    get:
      tags: [Health]
      summary: Service health
      operationId: healthz
      security:
        - bearerAuth: []
      description: Requires role `developer`.
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /readyz:
    get:
      tags: [Health]
      summary: Database readiness
      operationId: readyz
      security:
        - bearerAuth: []
      description: Requires role `developer`. Pings PostgreSQL.
      responses:
        '200':
          description: Database is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Database not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from signup or login

  parameters:
    restaurantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    restaurantNameFilter:
      name: restaurant
      in: query
      schema:
        type: string
      description: Case-insensitive substring match on restaurant name
    statusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/RestaurantStatus'
    isContactedFilter:
      name: is_contacted
      in: query
      schema:
        type: boolean
    shownInterestFilter:
      name: shown_interest
      in: query
      schema:
        type: boolean
    ocrStatusFilter:
      name: ocr_status
      in: query
      schema:
        $ref: '#/components/schemas/OCRStatus'
      description: Filter restaurant rows by profile OCR status; use `verified` for verified-only.
    includeArchivedFilter:
      name: include_archived
      in: query
      schema:
        type: boolean
        default: false
    campaignId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Email campaign UUID
    demoSiteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Demo site UUID
    scrapeJobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Durable city scrape job UUID
    trackingToken:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: Opaque tracking token from `email_tracking_tokens`

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Authentication required.
    Forbidden:
      description: Insufficient role or restaurant access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: You do not have access to this restaurant.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: Restaurant was not found.
    Conflict:
      description: Resource conflict (e.g. duplicate email)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict
              message: Email is already registered.
    CampaignConflict:
      description: Campaign state conflict (e.g. already stopped)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: campaign_stopped
              message: campaign is stopped
    CampaignNotEligible:
      description: Campaign or restaurant not eligible to send
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_eligible
              message: 'campaign is not eligible to send: restaurant profile is not approved for outreach'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: Request body must be valid JSON.

    SignupRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/SignupRole'

    SignupRole:
      type: string
      enum: [restaurant_owner, developer]
      default: restaurant_owner

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResult:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Seconds until token expiry
        user:
          $ref: '#/components/schemas/UserView'

    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UserRole:
      type: string
      enum: [internal_admin, restaurant_owner, developer]

    AuthMe:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'

    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [internal_admin]

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        restaurants:
          type: array
          items:
            $ref: '#/components/schemas/UserRestaurantMembership'

    UserRestaurantMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/RestaurantStatus'
        member_role:
          type: string
          example: owner

    RestaurantStatus:
      type: string
      enum:
        - lead
        - demo_ready
        - emailed
        - interested
        - client_onboarding
        - active_client
        - lost
        - archived

    Restaurant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        ocr_status:
          $ref: '#/components/schemas/OCRStatus'
        status:
          $ref: '#/components/schemas/RestaurantStatus'
        is_contacted:
          type: boolean
        shown_interest:
          type: boolean
        email_sent:
          type: boolean
          description: True only after a confirmed provider-accepted outreach send.
        email_send_count:
          type: integer
          minimum: 0
          description: Number of confirmed sends recorded for this restaurant.
        last_email_sent_at:
          type: string
          format: date-time
          nullable: true
        last_email_send_sequence:
          type: integer
          format: int64
          nullable: true
          description: Global delivery-attempt sequence associated with the latest confirmed send.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RestaurantList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Restaurant'

    CreateRestaurantRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    UpdateRestaurantRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        is_contacted:
          type: boolean
        shown_interest:
          type: boolean

    UpdateRestaurantStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/RestaurantStatus'

    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        member_role:
          type: string
          example: owner
        created_at:
          type: string
          format: date-time

    MemberList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    AddMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        member_role:
          type: string
          default: owner

    CreateDemoSiteRequest:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
        status:
          type: string
          enum: [draft]
          default: draft
          description: Generic creation is draft-only; use the audited demo status endpoint to publish.
        public_payload:
          type: object
          additionalProperties: true
          description: |
            Optional explicit snapshot stored server-side. When omitted, the server builds
            the current restaurant-specific public payload; only allowlisted keys are public.

    CreateDemoSiteResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        token:
          type: string
          description: Returned once; required for public demo URL
        status:
          type: string
          enum: [draft]

    OCRStatus:
      type: string
      enum: [pending, running, verified, no_images, failed]
      description: |
        `verified` means at least one usable image was processed successfully and is the
        only OCR state eligible for profile approval. `no_images` is not equivalent to verified.

    ProfileReviewStatus:
      type: string
      enum: [draft, approved, rejected]

    ProfileReviewRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ProfileReviewStatus'
        expected_restaurant_updated_at:
          type: string
          format: date-time
          description: Required for `approved` or `rejected`; copy from the protected profile preview.
        expected_profile_updated_at:
          type: string
          format: date-time
          description: Required for `approved` or `rejected`; copy from the protected profile preview.

    ProfileReviewPreview:
      type: object
      required:
        - restaurant_id
        - restaurant_name
        - contact_email
        - ocr_status
        - ocr_checked
        - ocr_input_fingerprint
        - ocr_attempts
        - ocr_verification_errors
        - review_status
        - restaurant_updated_at
        - profile_updated_at
        - profile
      properties:
        restaurant_id:
          type: string
          format: uuid
        restaurant_name:
          type: string
        contact_email:
          type: string
        ocr_status:
          $ref: '#/components/schemas/OCRStatus'
        ocr_checked:
          type: boolean
          description: True once at least one OCR attempt has started for this row.
        ocr_input_fingerprint:
          type: string
        ocr_started_at:
          type: string
          format: date-time
          nullable: true
        ocr_completed_at:
          type: string
          format: date-time
          nullable: true
        ocr_attempts:
          type: integer
          minimum: 0
        ocr_verification_errors:
          type: array
          items:
            type: string
        apollo_status:
          type: string
          description: Per-restaurant Apollo result such as enriched, skipped_no_domain, no_candidate, or no_match.
        apollo_email_found:
          type: boolean
        review_status:
          $ref: '#/components/schemas/ProfileReviewStatus'
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        restaurant_updated_at:
          type: string
          format: date-time
        profile_updated_at:
          type: string
          format: date-time
        profile:
          type: object
          additionalProperties: true

    GooglePhotoAttribution:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
        uri:
          type: string
          format: uri

    GooglePlacePhoto:
      type: object
      required: [url, author_attributions]
      properties:
        url:
          type: string
          format: uri
        width_px:
          type: integer
        height_px:
          type: integer
        author_attributions:
          type: array
          items:
            $ref: '#/components/schemas/GooglePhotoAttribution'

    GooglePlacePhotos:
      type: object
      required:
        - restaurant_id
        - google_place_id
        - photos
        - refreshed_at
        - urls_are_temporary
      properties:
        restaurant_id:
          type: string
          format: uuid
        google_place_id:
          type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/GooglePlacePhoto'
        refreshed_at:
          type: string
          format: date-time
        urls_are_temporary:
          type: boolean

    GeneratedSiteTemplate:
      type: object
      required: [id, name, url]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri

    GeneratedSite:
      type: object
      required:
        - restaurant_id
        - restaurant_name
        - google_place_id
        - site_index
        - templates
        - shareable
      properties:
        restaurant_id:
          type: string
          format: uuid
        restaurant_name:
          type: string
        google_place_id:
          type: string
        site_index:
          type: integer
          minimum: 0
        templates:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedSiteTemplate'
        shareable:
          type: boolean

    ProfileReview:
      type: object
      required: [restaurant_id, status, ocr_status, updated_at]
      properties:
        restaurant_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ProfileReviewStatus'
        ocr_status:
          $ref: '#/components/schemas/OCRStatus'
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time

    DemoStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [draft, published]
        expected_updated_at:
          type: string
          format: date-time
          description: Required for `published`; copy from the protected demo review preview.

    DemoReview:
      type: object
      required: [demo_site_id, restaurant_id, status, updated_at]
      properties:
        demo_site_id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, published]
        published_at:
          type: string
          format: date-time
          nullable: true
        published_by:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time

    DemoReviewPreview:
      type: object
      required:
        - demo_site_id
        - restaurant_id
        - slug
        - status
        - public_payload
        - created_at
        - updated_at
      properties:
        demo_site_id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          type: string
          enum: [draft, published]
        expires_at:
          type: string
          format: date-time
          nullable: true
        public_payload:
          $ref: '#/components/schemas/PublicDemoPayload'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateScrapeJobRequest:
      type: object
      required: [city]
      properties:
        city:
          type: string
          enum: [Adelaide, Brisbane, Melbourne, Perth, Sydney]
        niche:
          type: string
          enum: [restaurant, dentist, plumber]
          default: restaurant

    ScrapeJobStatus:
      type: string
      enum: [queued, running, waiting, completed, failed, cancelled]

    ScrapeJobProgress:
      type: object
      required:
        - cells_total
        - cells_pending
        - cells_completed
        - cells_subdivided
        - cells_failed
        - cells_saturated
        - candidates_total
        - candidates_pending
        - candidates_imported
        - candidates_duplicate
        - candidates_failed
      properties:
        cells_total:
          type: integer
        cells_pending:
          type: integer
        cells_completed:
          type: integer
        cells_subdivided:
          type: integer
        cells_failed:
          type: integer
        cells_saturated:
          type: integer
          description: Provider-capped leaves at the configured maximum subdivision depth; they keep the current city pass incomplete and retry after the 24-hour coverage cooldown.
        candidates_total:
          type: integer
        candidates_pending:
          type: integer
        candidates_imported:
          type: integer
        candidates_duplicate:
          type: integer
        candidates_failed:
          type: integer

    ScrapeJob:
      type: object
      required:
        - id
        - city
        - city_key
        - niche
        - status
        - cycle_number
        - max_requests_per_window
        - requests_used_window
        - requests_used_total
        - created_at
        - updated_at
        - progress
      properties:
        id:
          type: string
          format: uuid
        city:
          type: string
        city_key:
          type: string
        niche:
          type: string
        status:
          $ref: '#/components/schemas/ScrapeJobStatus'
        cycle_number:
          type: integer
          minimum: 1
        max_requests_per_window:
          type: integer
          example: 500
        requests_used_window:
          type: integer
        requests_used_total:
          type: integer
          format: int64
        window_started_at:
          type: string
          format: date-time
          nullable: true
        resume_at:
          type: string
          format: date-time
          nullable: true
        waiting_reason:
          type: string
          enum: [request_limit, provider_error, coverage_incomplete, revisit]
        last_cycle_completed_at:
          type: string
          format: date-time
          nullable: true
        current_cell_id:
          type: string
          format: uuid
          nullable: true
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        progress:
          $ref: '#/components/schemas/ScrapeJobProgress'

    ScrapeJobTriggerResult:
      type: object
      required: [created, job]
      properties:
        created:
          type: boolean
        job:
          $ref: '#/components/schemas/ScrapeJob'

    ScrapeJobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ScrapeJob'

    CampaignStatus:
      type: string
      enum: [draft, approved, sending, sent, stopped, send_unknown]
      description: |
        `send_unknown` is a fail-closed terminal state for an ambiguous provider result.
        It requires manual reconciliation and cannot be re-approved or retried automatically.

    CampaignType:
      type: string
      enum: [outreach]
      default: outreach

    EmailEventType:
      type: string
      enum: [sent, skipped, opened, clicked, failed, unsubscribed, draft_regenerated]

    CreateCampaignRequest:
      type: object
      required: [demo_site_id, demo_token]
      properties:
        demo_site_id:
          type: string
          format: uuid
          description: Draft or published demo site belonging to this restaurant
        demo_token:
          type: string
          description: One-time token from `POST .../demo-sites` response
        campaign_type:
          $ref: '#/components/schemas/CampaignType'

    CampaignApprovalRequest:
      type: object
      required: [expected_updated_at]
      properties:
        expected_updated_at:
          type: string
          format: date-time
          description: Campaign `updated_at` returned by `GET /api/v1/campaigns/{id}` after human review.

    BulkOutreachTriggerResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          example: queued
        max_sends:
          type: integer
          example: 150
        pending_eligible_count:
          type: integer

    BulkOutreachStatusResponse:
      type: object
      properties:
        pending_eligible_count:
          type: integer
        max_sends:
          type: integer
        email_job:
          $ref: '#/components/schemas/EmailJobControl'
        next_available_at:
          type: string
          format: date-time
          nullable: true
          description: Earliest durable email-account availability when all configured accounts are cooling down.
        active_job:
          type: object
          nullable: true
          properties:
            job_id:
              type: string
            status:
              type: string
        last_completed_job:
          type: object
          nullable: true
          properties:
            job_id:
              type: string
            status:
              type: string
            summary:
              type: object
              properties:
                attempted:
                  type: integer
                sent:
                  type: integer
                skipped:
                  type: integer
                failed:
                  type: integer
                max_sends:
                  type: integer
                stopped_reason:
                  type: string
                next_available_at:
                  type: string
                  format: date-time
                  nullable: true

    EmailJobControl:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        enabled_at:
          type: string
          format: date-time
          nullable: true
        enabled_by:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time

    EmailJobActionResponse:
      type: object
      properties:
        email_job:
          $ref: '#/components/schemas/EmailJobControl'
        job_id:
          type: string
        status:
          type: string
          enum: [queued, disabled]
        max_sends:
          type: integer
        pending_eligible_count:
          type: integer

    EmailAccountHealthResponse:
      type: object
      properties:
        enabled:
          type: boolean
        recipient:
          type: string
          format: email
        interval_hours:
          type: integer
          minimum: 24
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/EmailAccountHealth'

    EmailAccountHealth:
      type: object
      properties:
        account_key:
          type: string
        provider:
          type: string
          enum: [gmail]
        provider_identity:
          type: string
        from_email:
          type: string
          format: email
        enabled:
          type: boolean
        status:
          type: string
          enum: [pending, checking, healthy, failed, disabled]
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        next_check_at:
          type: string
          format: date-time
          nullable: true
        provider_message_id:
          type: string
        last_error:
          type: string

    DemoSessionCapability:
      type: object
      required: [session_id, session_token]
      properties:
        session_id:
          type: string
          format: uuid
        session_token:
          type: string

    DemoSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        demo_site_id:
          type: string
          format: uuid
          nullable: true
        restaurant_id:
          type: string
          format: uuid
        template_id:
          type: string
          enum: ['1', '2', '3']
        started_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          minimum: 0
        transcript:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              role:
                type: string
                enum: [user, assistant, system]
              content:
                type: string
              occurred_at:
                type: string
                format: date-time

    StopCampaignRequest:
      type: object
      properties:
        reason:
          type: string
          default: stopped by admin

    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        demo_site_id:
          type: string
          format: uuid
        campaign_type:
          $ref: '#/components/schemas/CampaignType'
        status:
          $ref: '#/components/schemas/CampaignStatus'
        current_step:
          type: integer
        subject:
          type: string
        body_html:
          type: string
          description: Draft HTML whose `{{CLICK_URL}}`, optional `{{TEMPLATE_1_URL}}`–`{{TEMPLATE_3_URL}}`, and `{{UNSUBSCRIBE_URL}}` placeholders are replaced at send time.
        body_text:
          type: string
        approved_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          type: string
          format: uuid
          nullable: true
        last_sent_at:
          type: string
          format: date-time
          nullable: true
        stopped_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CampaignList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'

    EmailEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/EmailEventType'
        metadata:
          type: object
          additionalProperties: true
          description: |
            For quota-managed `sent`/`failed`: account_key, account_cycle,
            account_sequence, global send_sequence, and delivery_attempt_id.
            For `clicked`/`opened`/`unsubscribed`: token and optional target_url.
        event_time:
          type: string
          format: date-time
        restaurant_id:
          type: string
          format: uuid

    CampaignDetail:
      type: object
      properties:
        campaign:
          $ref: '#/components/schemas/Campaign'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EmailEvent'

    ReservationAvailability:
      type: object
      required: [available_slots, timezone, date, party_size]
      properties:
        available_slots:
          type: array
          items:
            type: string
            format: date-time
        timezone:
          type: string
          example: Australia/Sydney
        date:
          type: string
          format: date
        party_size:
          type: integer
          minimum: 1
          maximum: 20

    PutReservationRequest:
      type: object
      required: [guest_name, guest_phone, party_size, slot]
      properties:
        guest_name:
          type: string
        guest_phone:
          type: string
        guest_email:
          type: string
          format: email
        party_size:
          type: integer
          minimum: 1
          maximum: 20
        slot:
          type: string
          format: date-time
          description: Exact RFC3339 value returned by table availability.
        source:
          type: string
          enum: [voice_agent, web_form]
          default: voice_agent
        notes:
          type: string
        client_request_id:
          type: string
          description: Stable caller-generated idempotency key reused only with the identical request body.

    PutReservationResponse:
      type: object
      required: [status, reservation_id, message]
      properties:
        status:
          type: string
          enum: [pending, confirmed, cancelled]
          description: A newly created web request is pending; later idempotent reads reflect its current status.
        reservation_id:
          type: string
          format: uuid
        message:
          type: string
          example: Reservation request received. Status is pending confirmation.

    PublicDemoPayload:
      type: object
      required: [restaurant_id, restaurant_name]
      properties:
        restaurant_id:
          type: string
          format: uuid
          description: Server-derived restaurant identity for the resolved token-gated demo.
        restaurant_name:
          type: string
        cuisine:
          type: string
        hero:
          type: string
        hours:
          type: object
          additionalProperties: true
        address:
          type: string
        phone:
          type: string
        menu_sections:
          type: array
          items:
            type: object
            additionalProperties: true
        reservation_cta:
          type: string
        ai_receptionist_cta:
          type: string

    HealthzResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
        env:
          type: string
        version:
          type: string

    ReadyzResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: ready
