        The demo site's one-time `token` from create demo site must be supplied here,
        must match the selected demo's token hash, and must not be expired (it is stored
        on the campaign for tracked token-gated demo links).

        **Prerequisites:** demo site belonging to this restaurant; it may still be a draft.
        The OCR lead-preparation job normally creates or refreshes the draft demo and
        campaign together after verification. Publication is a later audited human gate.
