              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/outreach/bulk-send:
    post:
      tags: [Email Campaigns]
      summary: Enable and trigger the Gmail outreach job (compatibility route)
      operationId: triggerBulkOutreachSend
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Enables the persisted email-job control and enqueues
        an `outreach.bulk_send` job. The admin UI uses `PATCH /api/v1/outreach/email-job`.

        **Worker required:** run `make worker` in a separate terminal.

        Selects leads where:
        - `restaurant_profiles.ocr_status=verified`
        - profile review is `approved` with non-null `reviewed_at` and `reviewed_by`
        - demo is unexpired and `published` with non-null `published_at` and `published_by`
        - outreach campaign is `approved` with non-null `approved_at` and `approved_by`
        - `restaurants.email_sent=false` and `email_send_count=0`
        - contact email present and not suppressed

        The bulk job does not create or approve campaigns. It sends the already-approved
        sales outreach email (Tuvi presentation + three tracked personalized websites), rotating configured
        Google Workspace Gmail API accounts (`OUTREACH_GOOGLE_WORKSPACE_ACCOUNTS_JSON`).
        PostgreSQL atomically enforces
        `OUTREACH_EMAILS_PER_ACCOUNT` (default 40) delivery claims per account, assigns a
        global `send_sequence` plus per-account cycle/slot, and spreads the 40 slots across
        `OUTREACH_SEND_WINDOW` (default 8 hours). A persisted random offset between
        `OUTREACH_SEND_JITTER_MIN` and `OUTREACH_SEND_JITTER_MAX` (defaults 2-5 minutes)
        produces normal on-time gaps of roughly 9-15 minutes around the ~12-minute base
        slot. A global minimum-delay guard covers account transitions and delayed-worker
        catch-up. Each durable job activation makes at most one provider attempt and then
        releases the worker until the persisted `available_at`; it never sleeps between
        sends. After slot 40, `OUTREACH_EMAIL_COOLDOWN` (default 24 hours) applies.
        Duplicate provider identities are rejected even when configured with different aliases,
        preventing quota multiplication for one mailbox or credential.

        The per-account 40-attempt limit is a conservative ceiling, not a promise
        of 40 accepted or delivered emails. Fewer eligible approved leads, provider failures,
        or ambiguous outcomes can reduce confirmed sends; ambiguous outcomes consume a slot.

        If every account is cooling down, the same job is moved back to `queued` with its
        durable `available_at` set to the earliest account availability. The worker resumes
        it automatically; an admin does not need to retrigger it.

        On confirmed send: `restaurants.email_sent=true`, `email_send_count` increments,
        `last_email_send_sequence` is recorded, `is_contacted=true`, and `status=emailed`.
        An ambiguous provider outcome becomes campaign status `send_unknown` and is not
        automatically retried, preventing duplicate real-world delivery.
        Redirected sends are recorded as `skipped` and do not mark the restaurant emailed.
        Disabling the persisted UI control prevents the next provider request from beginning.

        Providers use HTTP(S) APIs only (`gmail` for the outreach account pool; `resend` or
        `zoho` for the generic adapter). SMTP configuration is rejected. Production link validation requires:
        `https://api.tuvisolutions.com`, `https://demo.tuvisolutions.com`,
        `https://tuvisolutions.com`, and `https://tuvisolutions.com/services/restaurants`.

        Returns `409` if another bulk job is already queued or running, and `503` when the
        Gmail OAuth account pool is not configured.
      responses:
        '202':
          description: Bulk job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOutreachTriggerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Bulk job already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Gmail OAuth outreach accounts not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/outreach/email-job:
