  /api/v1/scrape-jobs:
    post:
      tags: [Scrape Jobs]
      summary: Trigger or retrieve an active city scrape job
      operationId: triggerCityScrapeJob
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Creates one durable active job per normalized
        city/niche pair, or returns the existing `queued`, `running`, or `waiting` job.
        Supported cities are Adelaide, Brisbane, Melbourne, Perth, and Sydney; supported
        niches are `restaurant`, `dentist`, and `plumber` (`restaurant` by default).

        The scrape worker partitions the city into durable grid cells, subdivides saturated
        cells, deduplicates candidates by Google Place ID, and uses Google Places before
        targeted Apollo enrichment for missing owner/work-email details. The combined provider
        request window is capped at 500. A capped job becomes `waiting` with `resume_at` set
        24 hours later, then resumes from persisted cell/page/candidate state. A completed
        coverage pass is revisited in later cycles so newly added Place IDs can be discovered.
        A leaf that remains provider-capped at the configured maximum grid depth stays
        incomplete with `waiting_reason=coverage_incomplete`; it is not reported as a
        completed city coverage pass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScrapeJobRequest'
            example:
              city: Melbourne
              niche: restaurant
      responses:
        '202':
          description: New scrape job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJobTriggerResult'
        '200':
          description: Existing active city/niche job returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJobTriggerResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Unsupported city or niche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Scrape Jobs]
      summary: List recent city scrape jobs
      operationId: listCityScrapeJobs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 25
          description: Values above 100 are capped at 100.
      responses:
        '200':
          description: Recent scrape jobs ordered by creation time descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/scrape-jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/scrapeJobId'
    get:
      tags: [Scrape Jobs]
      summary: Get city scrape job progress
      operationId: getCityScrapeJob
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Durable request-window, resume, grid, and candidate progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/scrape-jobs/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/scrapeJobId'
    post:
      tags: [Scrape Jobs]
      summary: Retry a failed city scrape job from its durable progress
      operationId: retryCityScrapeJob
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Requeues only a `failed` job, resets failed
        cells/candidates for another attempt, and preserves imported candidates and
        durable city progress. A request window older than 24 hours is reset; a newer
        window keeps its consumed request count.
      responses:
        '202':
          description: Failed job requeued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Scrape job is not failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/outreach/sequences:
