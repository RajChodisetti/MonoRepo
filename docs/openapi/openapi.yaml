            $ref: '#/components/schemas/Campaign'

    EmailEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/EmailEventType'
        metadata:
          type: object
          additionalProperties: true
          description: |
            For quota-managed `sent`/`failed`: account_key, account_cycle,
            account_sequence, global send_sequence, and delivery_attempt_id.
            For `clicked`/`opened`/`unsubscribed`: token and optional target_url.
        event_time:
          type: string
          format: date-time
        restaurant_id:
          type: string
          format: uuid

    CampaignDetail:
      type: object
      properties:
        campaign:
          $ref: '#/components/schemas/Campaign'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EmailEvent'

    ConsultationCalendarSlot:
      type: object
      required:
        - date
        - time
        - iso
        - is_available
        - booked
        - past
        - effective_available
        - on_grid
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        iso:
          type: string
          format: date-time
          description: Canonical RFC3339 slot start with the configured timezone offset.
        is_available:
          type: boolean
          description: Persisted override value, or the configured-hours default when no override exists.
        booked:
          type: boolean
          description: True when any confirmed consultation interval overlaps this candidate interval.
        past:
          type: boolean
        effective_available:
          type: boolean
          description: True only when the slot is enabled, unbooked, on-grid, and in the future.
        on_grid:
          type: boolean
          description: False only for a historical confirmed booking outside the current candidate grid.

    ConsultationCalendar:
      type: object
      required:
        - month
        - revision
        - booked_call_count
        - timezone
        - slot_duration_minutes
        - business_hour_start
        - business_hour_end
        - slots
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Month revision to send as `expected_revision` on the next save.
        booked_call_count:
          type: integer
          minimum: 0
          description: Number of unique confirmed call records overlapping the month, independent of how many grid candidates each call blocks.
        timezone:
          type: string
          example: Australia/Sydney
        slot_duration_minutes:
          type: integer
          minimum: 1
        business_hour_start:
          type: string
          example: '09:00'
        business_hour_end:
          type: string
          example: '17:00'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ConsultationCalendarSlot'

    ConsultationCalendarUpdate:
      type: object
      required: [expected_revision, slots]
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
          description: Exact revision returned by the calendar GET or preceding successful PUT.
        slots:
          type: array
          description: Complete set of future on-grid candidates plus any canonical same-month candidates that crossed into the past after loading.
          items:
            type: object
            required: [iso, is_available]
            additionalProperties: false
            properties:
              iso:
                type: string
                format: date-time
                description: Exact canonical RFC3339 value returned by the calendar GET.
              is_available:
                type: boolean

    ConsultationSlot:
      type: object
      required: [date, time, iso, available]
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        iso:
          type: string
          format: date-time
          description: Canonical slot start using the configured consultation timezone offset.
        available:
          type: boolean

    ConsultationAvailabilityResult:
      type: object
      required: [status, slots]
      properties:
        status:
          type: string
          enum: [success]
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ConsultationSlot'

    ConsultationCheckResult:
      type: object
      required: [available, slot, date, time]
      properties:
        available:
          type: boolean
        alternatives:
          type: array
          description: Nearest enabled, unbooked candidates when the requested slot is unavailable.
          items:
            type: string
            format: date-time
        slot:
          type: string
          format: date-time
        date:
          type: string
          format: date
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'

    ConsultationBookRequest:
      type: object
      required: [date, time, prospect_name, prospect_email]
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          description: Local time aligned to the configured consultation grid.
          example: '09:30'
        prospect_name:
          type: string
          minLength: 1
        prospect_email:
          type: string
          format: email
        prospect_phone:
          type: string
        source:
          type: string
          enum: [voice, web]
          default: voice

    ConsultationBookSuccess:
      type: object
      required:
        - status
        - confirmation_code
        - prospect_name
        - prospect_email
        - prospect_phone
        - slot
        - booking_date
        - booking_time
        - calendar_link
        - message
      properties:
        status:
          type: string
          enum: [success]
        confirmation_code:
          type: string
          example: TVI-A1B2C3
        prospect_name:
          type: string
        prospect_email:
          type: string
          format: email
        prospect_phone:
          type: string
        slot:
          type: string
          format: date-time
        booking_date:
          type: string
          format: date
        booking_time:
          type: string
        calendar_link:
          type: string
        message:
          type: string

    ConsultationBookConflict:
      type: object
      required: [status, message, alternatives]
      properties:
        status:
          type: string
          enum: [conflict]
        message:
          type: string
        alternatives:
          type: array
          items:
            type: string
            format: date-time

    ConsultationStatusError:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string

    ReservationAvailability:
      type: object
      required: [available_slots, timezone, date, party_size]
      properties:
        available_slots:
          type: array
          items:
            type: string
            format: date-time
        timezone:
          type: string
          example: Australia/Sydney
        date:
          type: string
          format: date
        party_size:
          type: integer
          minimum: 1
          maximum: 20

    PutReservationRequest:
      type: object
      required: [guest_name, guest_phone, party_size, slot]
      properties:
        guest_name:
          type: string
        guest_phone:
          type: string
        guest_email:
          type: string
          format: email
        party_size:
          type: integer
          minimum: 1
          maximum: 20
        slot:
          type: string
          format: date-time
          description: Exact RFC3339 value returned by table availability.
        source:
          type: string
          enum: [voice_agent, web_form]
          default: voice_agent
        notes:
          type: string
        client_request_id:
          type: string
          description: Stable caller-generated idempotency key reused only with the identical request body.

    PutReservationResponse:
      type: object
      required: [status, reservation_id, message]
      properties:
        status:
          type: string
          enum: [pending, confirmed, cancelled]
          description: A newly created web request is pending; later idempotent reads reflect its current status.
        reservation_id:
          type: string
          format: uuid
        message:
          type: string
          example: Reservation request received. Status is pending confirmation.

    PublicDemoPayload:
      type: object
      required: [restaurant_id, restaurant_name]
      properties:
        restaurant_id:
          type: string
          format: uuid
          description: Server-derived restaurant identity for the resolved token-gated demo.
        restaurant_name:
          type: string
        cuisine:
          type: string
        hero:
          type: string
        hours:
          type: object
          additionalProperties: true
        address:
          type: string
        phone:
          type: string
        menu_sections:
          type: array
          items:
            type: object
            additionalProperties: true
        reservation_cta:
          type: string
        ai_receptionist_cta:
          type: string
        media:
          type: array
          description: Live attributed Google media plus manually approved owner/licensed media. Legacy scraped images and menu documents are excluded.
          items:
            $ref: '#/components/schemas/PublicMedia'
        media_manifest:
          type: object
          additionalProperties: true
          description: Durable media provenance included in the reviewed demo fingerprint.

    HealthzResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
        env:
          type: string
        version:
          type: string

    ReadyzResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: ready
