  /api/v1/outreach/sequences/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Email Campaigns]
      summary: Replace a draft sequence's name and steps
      operationId: updateOutreachSequence
      security:
        - bearerAuth: []
      description: |
        Steps are contiguous and 1-based. The first enabled step must use `delay_hours=0`.
        Every plain-text body must contain each managed placeholder exactly once:
        `{{website_url}}` and `{{unsubscribe_url}}`; no raw URL or HTML is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutreachSequenceRequest'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachSequence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/outreach/sequences/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Email Campaigns]
      summary: Approve and activate an immutable sequence version
      operationId: approveOutreachSequence
      security:
        - bearerAuth: []
      description: |
        Approval archives the prior active version. Untouched recipients (`current_step=0`
        with no delivery attempt/event) are atomically rebased to the new first enabled step;
        any recipient with delivery history remains pinned to the original version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveOutreachSequenceRequest'
      responses:
        '200':
          description: Approved active sequence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachSequence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/outreach/sequences/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Email Campaigns]
      summary: Preview every enabled plain-text step
      operationId: previewOutreachSequence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewOutreachSequenceRequest'
      responses:
        '200':
          description: Rendered steps with exactly two links per body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachSequencePreview'

  /api/v1/outreach/recipients:
    get:
      tags: [Email Campaigns]
      summary: List outreach recipient progression
      operationId: listOutreachRecipients
      security:
        - bearerAuth: []
